# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Internationalization
spring.messages.basename=messages/messages

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Resilience4j demo
management.endpoint.circuitbreakers.enabled=true
management.endpoint.circuitbreakerevents.enabled=true

# Downstream used by the Resilience4j demo (overridden in Kubernetes)
demo.downstream.host=localhost
demo.downstream.port=8081
demo.downstream.connect-timeout-ms=500
demo.downstream.read-timeout-ms=1000

resilience4j.circuitbreaker.instances.downstream.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.downstream.sliding-window-size=10
resilience4j.circuitbreaker.instances.downstream.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.downstream.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.downstream.slow-call-duration-threshold=1s
resilience4j.circuitbreaker.instances.downstream.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.downstream.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.downstream.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.downstream.automatic-transition-from-open-to-half-open-enabled=true

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h
