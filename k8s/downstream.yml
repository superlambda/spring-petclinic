---
apiVersion: v1
kind: Service
metadata:
  name: petclinic-downstream
  labels:
    app: petclinic-downstream
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: petclinic-downstream

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-downstream
  labels:
    app: petclinic-downstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic-downstream
  template:
    metadata:
      labels:
        app: petclinic-downstream
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: workload
          image: petclinic:v3
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 30s
            - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
              value: readinessState,db
            - name: POSTGRES_URL
              value: jdbc:postgresql://demo-db:5432/petclinic
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: demo-db
                  key: username
            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: demo-db
                  key: password
            - name: SPRING_APPLICATION_JSON
              value: |
                {
                  "management.endpoint.health.probes.add-additional-paths": true
                }
            - name: SPRING_SQL_INIT_MODE
              value: never
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
